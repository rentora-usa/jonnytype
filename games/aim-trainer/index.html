<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aim Trainer | JonnyType</title><style>body{margin:0;background:#f7f7f5;font-family:system-ui;color:#252525;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center;width:min(850px,92vw)}a{color:#777;text-decoration:none}.arena{height:520px;background:#fff;border:1px solid #ddd;border-radius:18px;position:relative;overflow:hidden;margin-top:20px}.target{position:absolute;width:42px;height:42px;border-radius:50%;background:#e98d25;cursor:pointer}</style><div class="wrap"><a href="../../games.html">← games</a><h1>Aim Trainer</h1><p>hits: <b id="h">0</b> · time: <b id="t">30</b>s · avg: <b id="a">0</b>ms</p><div class="arena" id="r"></div></div><script>const r=document.querySelector('#r');let hits=0,start=Date.now(),spawn=Date.now(),samples=[];function make(){if(Date.now()-start>=30000)return;let z=document.createElement('div');z.className='target';z.style.left=Math.random()*(r.clientWidth-42)+'px';z.style.top=Math.random()*(r.clientHeight-42)+'px';z.onclick=()=>{samples.push(Date.now()-spawn);hits++;h.textContent=hits;spawn=Date.now();z.remove();make()};r.append(z)}make();setInterval(()=>{let left=Math.max(0,30-((Date.now()-start)/1000|0));t.textContent=left;a.textContent=samples.length?Math.round(samples.reduce((x,y)=>x+y,0)/samples.length):0;if(!left)r.innerHTML='<h2 style="text-align:center;padding-top:200px">done</h2>'},250)</script>
