<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake | JonnyType</title><style>body{margin:0;background:#f7f7f5;font-family:system-ui;color:#252525;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center}.board{width:400px;height:400px;max-width:85vw;max-height:85vw;background:#fff;border:1px solid #ddd;border-radius:16px;display:block;margin:20px auto}a{color:#777;text-decoration:none}</style><div class="wrap"><a href="../../games.html">← games</a><h1>Snake</h1><b>score: <span id="s">0</span></b><canvas id="c" class="board" width="400" height="400"></canvas><p>Arrow keys / WASD • Space to restart</p></div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),N=20,S=20;let a,d,f,sc,dead;function reset(){a=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d={x:1,y:0};f=spawn();sc=0;dead=0;document.querySelector('#s').textContent=0}function spawn(){let q;do q={x:Math.random()*N|0,y:Math.random()*N|0};while(a.some(z=>z.x===q.x&&z.y===q.y));return q}function draw(){x.clearRect(0,0,400,400);x.fillStyle='#e98d25';x.fillRect(f.x*S,f.y*S,S-2,S-2);a.forEach((z,i)=>{x.fillStyle=i?'#333':'#e98d25';x.fillRect(z.x*S,z.y*S,S-2,S-2)});if(dead){x.fillStyle='#333';x.font='bold 26px system-ui';x.textAlign='center';x.fillText('game over',200,190)}}function step(){if(dead)return;let h={x:a[0].x+d.x,y:a[0].y+d.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||a.some(z=>z.x===h.x&&z.y===h.y)){dead=1;draw();return}a.unshift(h);if(h.x===f.x&&h.y===f.y){sc++;document.querySelector('#s').textContent=sc;f=spawn()}else a.pop();draw()}addEventListener('keydown',e=>{let k=e.key.toLowerCase(),q=k==='arrowup'||k==='w'?{x:0,y:-1}:k==='arrowdown'||k==='s'?{x:0,y:1}:k==='arrowleft'||k==='a'?{x:-1,y:0}:k==='arrowright'||k==='d'?{x:1,y:0}:null;if(k===' '){reset();draw()}if(q&&!(q.x===-d.x&&q.y===-d.y))d=q});reset();draw();setInterval(step,110)</script>
