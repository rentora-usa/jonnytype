<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Rush | JonnyType</title><style>body{margin:0;background:#f7f7f5;font-family:system-ui;color:#252525;display:grid;place-items:center;min-height:100vh}.wrap{width:min(800px,92vw);text-align:center}a{color:#777;text-decoration:none}.arena{height:450px;background:#fff;border:1px solid #ddd;border-radius:18px;position:relative;overflow:hidden;margin:20px 0}.word{position:absolute;font:600 20px monospace;top:-30px}.input{width:80%;padding:13px;border:1px solid #ddd;border-radius:10px}</style><div class="wrap"><a href="../../games.html">← games</a><h1>Typing Rush</h1><b>score: <span id="s">0</span></b><div class="arena" id="r"></div><input class="input" id="i" autocomplete="off" placeholder="type the words here"><p>Type each word before it reaches the bottom.</p></div><script>const list='apple river planet school orange keyboard window summer computer thunder rocket tennis coffee banana'.split(' '),r=document.querySelector('#r'),i=document.querySelector('#i');let active=null,score=0;function spawn(){if(active)return;let w=document.createElement('div');w.className='word';w.textContent=list[Math.random()*list.length|0];w.style.left=10+Math.random()*75+'%';r.append(w);active=w;let y=-30,t=setInterval(()=>{y+=2.1;w.style.top=y+'px';if(y>430){clearInterval(t);w.remove();active=null;i.value='';spawn()}},30)}i.oninput=()=>{if(active&&i.value.trim()===active.textContent){score++;s.textContent=score;active.remove();active=null;i.value='';spawn()}};spawn();i.focus()</script>
