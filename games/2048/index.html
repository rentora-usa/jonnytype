<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 | JonnyType</title><style>body{margin:0;background:#f7f7f5;font-family:system-ui;color:#252525;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center}a{color:#777;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(4,78px);gap:8px;background:#ddd;border-radius:14px;padding:8px}.tile{width:78px;height:78px;background:#eee;border-radius:9px;display:grid;place-items:center;font-size:25px;font-weight:800}</style><div class="wrap"><a href="../../games.html">← games</a><h1>2048</h1><p>score: <b id="s">0</b></p><div id="g" class="grid"></div><p>Arrow keys • R to restart</p></div><script>const g=document.querySelector('#g'),s=document.querySelector('#s');let a=[],score=0;function reset(){a=Array(16).fill(0);score=0;add();add();draw()}function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.random()*z.length|0]]=2}function draw(){g.innerHTML=a.map(v=>`<div class="tile">${v||''}</div>`).join('');s.textContent=score}function move(d){let b=a.slice();if(d==='left'||d==='right'){for(let r=0;r<4;r++){let q=a.slice(r*4,r*4+4);if(d==='right')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;score+=q[i];q.splice(i+1,1)}while(q.length<4)q.push(0);if(d==='right')q.reverse();for(let c=0;c<4;c++)a[r*4+c]=q[c]}}else{for(let c=0;c<4;c++){let q=[a[c],a[c+4],a[c+8],a[c+12]];if(d==='down')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;score+=q[i];q.splice(i+1,1)}while(q.length<4)q.push(0);if(d==='down')q.reverse();for(let r=0;r<4;r++)a[r*4+c]=q[r]}}if(a.some((v,i)=>v!==b[i])){add();draw()}}addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')reset();else if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key.slice(5).toLowerCase())}});reset()</script>
